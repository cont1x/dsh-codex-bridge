# Headless disables the credential store by default. Restore the native store
# without extracting secrets into environment variables or bridge log files.
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
  config:
    desktopPlatform: win32
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
